name: Publicar Sismi para Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias web
        run: npm ci

      - name: Preparar Rust estable
        uses: dtolnay/rust-toolchain@stable

      - name: Preparar herramientas C++ de Windows
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Preparar notas de la versión
        id: changelog
        shell: pwsh
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw
          $match = [regex]::Match($changelog, '(?ms)^## \[[^\]]+\].*?(?=^## \[|\z)')
          if (-not $match.Success) {
            throw "No se encontró la entrada de la versión en CHANGELOG.md"
          }
          $body = $match.Value.Trim()
          "body<<CHANGELOG_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "CHANGELOG_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Crear instalador y publicar actualización
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Sismi v__VERSION__
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
