name: Publicar Sismi para Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias web
        run: npm ci

      - name: Preparar Rust estable
        uses: dtolnay/rust-toolchain@stable

      - name: Preparar herramientas C++ de Windows
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Crear instalador y publicar actualización
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Sismi v__VERSION__
          releaseBody: Descarga e instala esta versión de Sismi para mantener tu monitoreo sísmico actualizado.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
